name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            binary: target/x86_64-unknown-linux-musl/release/bastest
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            binary: target/aarch64-unknown-linux-musl/release/bastest
          - os: macos-26
            target: aarch64-apple-darwin
            platform: darwin-arm64
            binary: target/aarch64-apple-darwin/release/bastest
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            binary: target/x86_64-pc-windows-msvc/release/bastest.exe
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            platform: win32-arm64
            binary: target/aarch64-pc-windows-msvc/release/bastest.exe
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            index.crates.io:443
            registry.npmjs.org:443
            static.crates.io:443
            static.rust-lang.org:443
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            esm.ubuntu.com:443
            security.ubuntu.com:443
            dl.deno.com:443
            deno.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: ${{ matrix.target }}
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
      - name: Configure musl compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> $GITHUB_ENV
          echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> $GITHUB_ENV
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> $GITHUB_ENV
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> $GITHUB_ENV
      - name: Build JavaScript
        run: deno task build
      - name: Build
        run: cargo build --release
      - name: Test
        run: deno task test
      - name: Prepare platform package
        run: deno run --allow-read --allow-write scripts/prepare-platform-package.ts ${{ matrix.platform }} ${{ matrix.binary }} 0.0.0
      - name: Upload platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bastest-${{ matrix.platform }}
          path: dist/@bastest/${{ matrix.platform }}
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            index.crates.io:443
            registry.npmjs.org:443
            static.crates.io:443
            static.rust-lang.org:443
            dl.deno.com:443
            deno.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
      - name: Check formatting
        run: deno task format:check
      - name: Lint
        run: deno task lint:check
      - name: Typecheck
        run: deno task typecheck

  publish-preview:
    if: >
      github.repository == 'ryuapp/bastest' &&
      github.event_name == 'pull_request'
    name: Pkg Preview
    runs-on: ubuntu-latest
    needs:
      - ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pkg.pr.new:443
            registry.npmjs.org:443
            dl.deno.com:443
            deno.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
      - name: Build JavaScript package
        run: |
          deno task build
          deno run --allow-read --allow-write scripts/prepare-npm-package.ts 0.0.0
      - name: Download linux-x64-musl package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bastest-linux-x64-musl
          path: dist/@bastest/linux-x64-musl
      - name: Download linux-arm64-musl package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bastest-linux-arm64-musl
          path: dist/@bastest/linux-arm64-musl
      - name: Download darwin-arm64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bastest-darwin-arm64
          path: dist/@bastest/darwin-arm64
      - name: Download win32-x64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bastest-win32-x64
          path: dist/@bastest/win32-x64
      - name: Download win32-arm64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bastest-win32-arm64
          path: dist/@bastest/win32-arm64
      - name: List npm packages
        run: find ./dist -maxdepth 3 -type f | sort
      - name: Publish preview
        run: deno task publish:preview
